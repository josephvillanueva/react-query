<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 488" width="1160" height="488" role="img" aria-labelledby="t"><title id="t">Backlog Board architecture</title><style>svg{--bg:#ffffff;--zone:#f5f6f8;--zoneStroke:#d5d9e0;--zoneLabel:#0a6fb8;--node:#ffffff;--nodeStroke:#c4cad3;--title:#111827;--text:#4b5563;--edge:#6b7280;--edgeText:#374151;--accent:#0a84d6;--pill:#ffffff;}@media (prefers-color-scheme: dark){svg{--bg:#0f1218;--zone:#151a23;--zoneStroke:#2a313d;--zoneLabel:#4db5ff;--node:#1b212c;--nodeStroke:#363e4c;--title:#f3f4f6;--text:#a4acb9;--edge:#8a93a2;--edgeText:#d1d5db;--accent:#4db5ff;--pill:#0f1218;}}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.bg{fill:var(--bg)}
.zone{fill:var(--zone);stroke:var(--zoneStroke);stroke-width:1;stroke-dasharray:5 4}
.zlabel{fill:var(--zoneLabel);font-size:12px;font-weight:700;letter-spacing:.08em}
.zsub{fill:var(--text);font-size:12px}
.node{fill:var(--node);stroke:var(--nodeStroke);stroke-width:1.2}
.node.key{stroke:var(--accent);stroke-width:2}
.bar{fill:var(--accent)}
.ntitle{fill:var(--title);font-size:14px;font-weight:600}
.ntext{fill:var(--text);font-size:12px}
.edge{fill:none;stroke:var(--edge);stroke-width:1.5}
.edge.alt{stroke-dasharray:6 4}
.head{fill:var(--edge)}
.pill{fill:var(--pill);stroke:var(--zoneStroke);stroke-width:1}
.elabel{fill:var(--edgeText);font-size:11.5px}
.legend{fill:var(--text);font-size:12px}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" width="1160" height="488" rx="14"/><rect class="zone" x="16" y="16" width="1128" height="424" rx="12"/><text class="zlabel" x="36" y="46">BROWSER</text><text class="zsub" x="36" y="66">Static build on Vercel. There is no server; mockApi.ts plays the backend.</text><path class="edge" d="M248,157.5 L338,157.5" marker-end="url(#arrow)"/><path class="edge" d="M538,157.5 L628,157.5" marker-end="url(#arrow)"/><path class="edge" d="M828,157.5 L918,157.5" marker-end="url(#arrow)"/><path class="edge" d="M1018,203 L1018,310" marker-end="url(#arrow)"/><path class="edge" d="M728,112 L728,98 Q728,88 718,88 L158,88 Q148,88 148,98 L148,112" marker-end="url(#arrow)"/><path class="edge" d="M438,310 L438,266 Q438,256 448,256 L658,256 Q668,256 668,246 L668,203" marker-end="url(#arrow)"/><path class="edge alt" d="M748,203 L748,310" marker-end="url(#arrow)"/><path class="edge alt" d="M728,401 L728,410.5 Q728,420 718.5,420 L158,420 Q148,420 148,410 L148,203" marker-end="url(#arrow)"/><rect class="node" x="48" y="112" width="200" height="91" rx="10"/><text class="ntitle" x="64" y="139">React components</text><text class="ntext" x="64" y="160">Board, cards, dialogs, toolbar</text><text class="ntext" x="64" y="177">Filter input deferred with</text><text class="ntext" x="64" y="194">useDeferredValue</text><rect class="node" x="338" y="112" width="200" height="91" rx="10"/><text class="ntitle" x="354" y="139">queries.ts</text><text class="ntext" x="354" y="160">One query key factory</text><text class="ntext" x="354" y="177">useStories, useStory</text><text class="ntext" x="354" y="194">Optimistic update, delete</text><rect class="node key" x="628" y="112" width="200" height="91" rx="10"/><text class="ntitle" x="644" y="139">QueryClient cache</text><text class="ntext" x="644" y="160">A list entry per filter combo</text><text class="ntext" x="644" y="177">staleTime 30 s, retry 1</text><text class="ntext" x="644" y="194">Snapshots kept for rollback</text><rect class="node" x="918" y="112" width="200" height="91" rx="10"/><text class="ntitle" x="934" y="139">mockApi.ts</text><text class="ntext" x="934" y="160">Stand-in REST backend</text><text class="ntext" x="934" y="177">350 to 1100 ms latency</text><text class="ntext" x="934" y="194">Optional 40% failure rate</text><rect class="node" x="338" y="310" width="200" height="74" rx="10"/><text class="ntitle" x="354" y="337">Query Devtools</text><text class="ntext" x="354" y="358">Loaded only on request</text><text class="ntext" x="354" y="375">Shows every cache entry</text><rect class="node" x="628" y="310" width="200" height="91" rx="10"/><text class="ntitle" x="644" y="337">MutationCache</text><text class="ntext" x="644" y="358">One onError for every save</text><text class="ntext" x="644" y="375">Raises a toast saying the</text><text class="ntext" x="644" y="392">board was rolled back</text><rect class="node" x="918" y="310" width="200" height="74" rx="10"/><rect class="bar" x="918" y="322" width="3" height="50" rx="1.5"/><text class="ntitle" x="934" y="337">localStorage</text><text class="ntext" x="934" y="358">Stories survive a reload</text><text class="ntext" x="934" y="375">Reset restores seed data</text><rect class="pill" x="270.9" y="140.5" width="44.2" height="34" rx="5"/><text class="elabel" x="293" y="154.5" text-anchor="middle">calls</text><text class="elabel" x="293" y="168.5" text-anchor="middle">hooks</text><rect class="pill" x="551.24" y="140.5" width="63.52" height="34" rx="5"/><text class="elabel" x="583" y="154.5" text-anchor="middle">patch +</text><text class="elabel" x="583" y="168.5" text-anchor="middle">snapshot</text><rect class="pill" x="834.8" y="140.5" width="76.4" height="34" rx="5"/><text class="elabel" x="873" y="154.5" text-anchor="middle">queryFn,</text><text class="elabel" x="873" y="168.5" text-anchor="middle">mutationFn</text><rect class="pill" x="986.24" y="246.5" width="63.52" height="20" rx="5"/><text class="elabel" x="1018" y="260.5" text-anchor="middle">persists</text><rect class="pill" x="332.18" y="78" width="211.64000000000001" height="20" rx="5"/><text class="elabel" x="438" y="92" text-anchor="middle">subscribed components re-render</text><rect class="pill" x="521.24" y="246" width="63.52" height="20" rx="5"/><text class="elabel" x="553" y="260" text-anchor="middle">inspects</text><rect class="pill" x="722.68" y="239.5" width="50.64" height="34" rx="5"/><text class="elabel" x="748" y="253.5" text-anchor="middle">failed</text><text class="elabel" x="748" y="267.5" text-anchor="middle">save</text><rect class="pill" x="415.9" y="410" width="44.2" height="20" rx="5"/><text class="elabel" x="438" y="424" text-anchor="middle">toast</text><path class="edge" d="M36,462 L70,462" marker-end="url(#arrow)"/><text class="legend" x="80" y="466">Call or data flow</text><path class="edge alt" d="M224.24,462 L258.24,462" marker-end="url(#arrow)"/><text class="legend" x="268.24" y="466">Failure path</text><rect class="node key" x="378.88" y="454" width="22" height="16" rx="4"/><text class="legend" x="408.88" y="466">Core logic</text><rect class="node" x="506.08" y="454" width="22" height="16" rx="4"/><rect class="bar" x="506.08" y="457" width="3" height="10" rx="1.5"/><text class="legend" x="536.0799999999999" y="466">Persisted state</text></svg>
